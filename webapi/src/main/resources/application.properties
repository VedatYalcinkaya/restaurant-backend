# Server Configuration
server.port=${SERVER_PORT:8083}
spring.application.name=ala-sogus-backend

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.supportedSubmitMethods=["get", "put", "post", "delete", "options", "head", "patch", "trace"]
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true

# Multipart File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

# Tomcat File Upload Settings
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework=INFO
logging.level.com.demirciyazilim=DEBUG
logging.level.org.springframework.web=DEBUG

# Jackson Date Format
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC

# Mail Configuration - Common Settings
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT Expiration
app.jwt.expiration-milliseconds=1800000
app.jwt.refresh-expiration-milliseconds=604800000

# Ala Sogus branding and frontend configuration
app.restaurant.name=Ala Söğüş
app.contact.display-name=${APP_CONTACT_DISPLAY_NAME:${app.restaurant.name}}
app.contact.notification-email=${APP_CONTACT_NOTIFICATION_EMAIL:${spring.mail.properties.mail.smtp.from:${spring.mail.username:}}}
app.contact.website-url=${APP_CONTACT_WEBSITE_URL:}
app.contact.public-email=${APP_CONTACT_PUBLIC_EMAIL:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:8082,http://localhost:5173,http://127.0.0.1:5173}
app.openapi.production-url=${APP_OPENAPI_PRODUCTION_URL:}

# Active profile
# Development: spring.profiles.active=dev
# Production: spring.profiles.active=prod

# Admin Bootstrap
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}

spring.profiles.active=prod

# Note: Keep application-dev.properties or application-prod.properties alongside this file.
